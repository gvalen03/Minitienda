<form class="formulario" (ngSubmit)="enviar()">
  <div class="encabezado-formulario">
    <p class="etiqueta-formulario">Administración</p>
    <h2>Nuevo producto</h2>
    <p>Agrega artículos al catálogo.</p>
  </div>

  <div class="campos-formulario">
    <label class="campo-completo">
      Nombre
      <input name="nombre" [(ngModel)]="nombre" placeholder="Ej. Mango">
    </label>

    <label>
      Precio
      <input name="precio" type="number" step="0.01" [(ngModel)]="precio">
    </label>

    <label>
      Stock
      <input name="stock" type="number" [(ngModel)]="stock">
    </label>

    <label>
      Stock mínimo
      <input name="stockMinimo" type="number" min="0" [(ngModel)]="stockMinimo">
    </label>

    <label>
      Imagen
      <input name="imagen" [(ngModel)]="imagen" placeholder="/imagenes/mango.jpg">
    </label>
  </div>

  <button type="submit">Crear producto</button>
</form>
